<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#101216" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Browsers don't let form controls inherit font-family by default —
         without this, every button/input/select/textarea in the app
         renders in the OS default font instead of Barlow Condensed. */
      button, input, select, textarea, optgroup, option {
        font-family: inherit;
      }
      /* Kills the blue/gray tap-highlight box mobile browsers flash on
         any tap, and the focus ring browsers leave on a button after
         it's clicked — taps should just act, with no visual residue. */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      button:focus, a:focus, button:focus-visible, a:focus-visible {
        outline: none;
      }
      /* Chrome/Android's native "pull down at the top of the page to
         reload" gesture is easy to trigger by accident on a scrollable
         screen (workout log, history, exercise picker) and, unlike a
         real refresh button, gives no warning before it reloads the
         whole app mid-workout. overscroll-behavior-y: none on both html
         and body (Android needs it on the actual scrolling element,
         which varies by browser chrome, so setting both covers it)
         disables just that overscroll-triggered navigation — normal
         scrolling everywhere else is untouched. */
      html, body {
        overscroll-behavior-y: none;
      }
      html, body, #root {
        height: 100%;
        overflow: hidden;
      }
    </style>
    <title>DeltaLog</title>
    <script>
      // Self-heals the exact "logo shows, then gray screen" failure: if
      // this tab is holding a stale app shell (an old cached index.html
      // and/or service-worker precache) from before a deploy that
      // removed the JS/CSS files it references, the browser can't load
      // them and the app never finishes booting -- previously the only
      // fix was manually clearing site data. This runs before the app
      // bundle itself (inline, in <head>, ahead of the module script
      // tag below) specifically so it's already listening even in the
      // worst case where the main bundle fails to load at all -- a
      // handler defined inside that bundle would never run if the
      // bundle itself is what's missing.
      //
      // Catches two failure shapes: (1) a <script>/<link> tag failing
      // to load (capturing-phase 'error', which does fire for resource
      // load failures even though they don't bubble), and (2) a
      // dynamic-import/chunk-load rejection surfacing as an unhandled
      // promise rejection, which is how Vite/Workbox module-loading
      // failures typically present.
      //
      // On either, clears this origin's Cache Storage (dropping any
      // stale service-worker precache) and does exactly one hard
      // reload -- guarded by a sessionStorage flag so a genuine,
      // reload-won't-fix-it error can't trap someone in a loop; it
      // tries once per tab session, then gets out of the way and lets
      // the real error surface normally.
      (function () {
        var FLAG = "dl_stale_asset_reload_attempted";
        function isStaleAssetMessage(msg) {
          if (!msg) return false;
          return /Failed to fetch dynamically imported module|Loading chunk .* failed|error loading dynamically imported module|Importing a module script failed|Unable to preload CSS|MIME type/i.test(msg);
        }
        function reloadOnce() {
          if (sessionStorage.getItem(FLAG)) return;
          sessionStorage.setItem(FLAG, "1");
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}).then(function () {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }
        window.addEventListener("error", function (e) {
          var tag = e && e.target && e.target.tagName;
          if (tag === "SCRIPT" || tag === "LINK") { reloadOnce(); return; }
          if (isStaleAssetMessage(e && e.message)) reloadOnce();
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var reason = e && e.reason;
          var msg = (reason && reason.message) || String(reason || "");
          if (isStaleAssetMessage(msg)) reloadOnce();
        });
      })();
    </script>
  </head>
  <body style="margin:0; background:#101216; font-family: 'Barlow Condensed', sans-serif; overscroll-behavior-y: none;">
    <div id="root" data-html2canvas-ignore="true"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
