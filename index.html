<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#101216" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Browsers don't let form controls inherit font-family by default —
         without this, every button/input/select/textarea in the app
         renders in the OS default font instead of Barlow Condensed. */
      button, input, select, textarea, optgroup, option {
        font-family: inherit;
      }
      /* Kills the blue/gray tap-highlight box mobile browsers flash on
         any tap, and the focus ring browsers leave on a button after
         it's clicked — taps should just act, with no visual residue. */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      button:focus, a:focus, button:focus-visible, a:focus-visible {
        outline: none;
      }
    </style>
    <title>DeltaLog</title>
  </head>
  <body style="margin:0; background:#101216; font-family: 'Barlow Condensed', sans-serif;">
    <div id="root" data-html2canvas-ignore="true"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
